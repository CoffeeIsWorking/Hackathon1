<!DOCTYPE html>
<html>
<head>
  <title>Fraud Investigation Graph</title>

  <script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>

  <style>
    #fraud-graph {
      width: 100%;
      height: 650px;
      border: 1px solid #d1d5db;
      background: #f8fafc;
    }
  </style>
</head>
<body>

  <h2>Transaction Relationship Graph</h2>
  <div id="fraud-graph"></div>

  <script>
    const graphData = {
      nodes: [
        {
          data: {
            id: "customer_101",
            label: "Customer 101",
            type: "customer",
            riskScore: 0.82
          }
        },
        {
          data: {
            id: "account_55",
            label: "Account 55",
            type: "account",
            riskScore: 0.91
          }
        },
        {
          data: {
            id: "device_abc",
            label: "Device ABC",
            type: "device",
            riskScore: 0.74
          }
        }
      ],
      edges: [
        {
          data: {
            id: "edge_1",
            source: "customer_101",
            target: "account_55",
            label: "owns"
          }
        },
        {
          data: {
            id: "edge_2",
            source: "customer_101",
            target: "device_abc",
            label: "uses"
          }
        }
      ]
    };

    const cy = cytoscape({
      container: document.getElementById("fraud-graph" ),

      elements: graphData,

      style: [
        {
          selector: "node",
          style: {
            "label": "data(label)",
            "text-valign": "center",
            "text-halign": "center",
            "font-size": "12px",
            "color": "#111827",
            "background-color": "#64748b",
            "width": "45px",
            "height": "45px"
          }
        },
        {
          selector: 'node[type="customer"]',
          style: {
            "shape": "ellipse",
            "background-color": "#2563eb"
          }
        },
        {
          selector: 'node[type="account"]',
          style: {
            "shape": "round-rectangle",
            "background-color": "#7c3aed"
          }
        },
        {
          selector: 'node[type="device"]',
          style: {
            "shape": "hexagon",
            "background-color": "#0891b2"
          }
        },
        {
          selector: "node[riskScore >= 0.8]",
          style: {
            "background-color": "#dc2626",
            "border-width": "4px",
            "border-color": "#991b1b"
          }
        },
        {
          selector: "edge",
          style: {
            "width": 2,
            "line-color": "#94a3b8",
            "target-arrow-color": "#94a3b8",
            "target-arrow-shape": "triangle",
            "curve-style": "bezier",
            "label": "data(label)",
            "font-size": "10px",
            "text-background-color": "#ffffff",
            "text-background-opacity": 1
          }
        }
      ],

      layout: {
        name: "cose",
        animate: true
      }
    });

    cy.on("tap", "node", function(event) {
      const node = event.target;

      alert(
        "Entity: " + node.data("label") +
        "\\nRisk score: " + node.data("riskScore")
      );
    });
  </script>

</body>
</html>
