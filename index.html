<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Payment Tracker</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            margin-top: 0;
            color: #0f172a;
        }

        .summary-box {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
        }

        .total-amount {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .history-section {
            margin-top: 30px;
            border-top: 2px solid var(--border);
            padding-top: 20px;
        }

        .payment-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .payment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .payment-item:last-child {
            border-bottom: none;
        }

        .payment-details {
            display: flex;
            flex-direction: column;
        }

        .payment-purpose {
            font-weight: 600;
        }

        .payment-date {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 2px;
        }

        .payment-value {
            font-weight: bold;
            color: #16a34a;
        }

        .clear-btn {
            background-color: #ef4444;
            margin-top: 15px;
        }
        .clear-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Change the name below to whoever you are tracking -->
        <h1>Payment Tracker: John Doe</h1>
        
        <div class="summary-box">
            <div>Total Amount Received</div>
            <div class="total-amount" id="totalDisplay">\$0.00</div>
        </div>

        <h2>Log New Payment</h2>
        <form id="paymentForm">
            <div class="form-group">
                <label for="amount">Amount (\$)</label>
                <input type="number" id="amount" step="0.01" placeholder="e.g. 50.00" required>
            </div>
            <div class="form-group">
                <label for="purpose">Description / Purpose</label>
                <input type="text" id="purpose" placeholder="e.g. Monthly Rent, Dinner split" required>
            </div>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" required>
            </div>
            <button type="submit">Add Payment</button>
        </form>

        <div class="history-section">
            <h2>Payment History</h2>
            <ul class="payment-list" id="paymentList">
                <!-- Payments will appear here dynamically -->
            </ul>
            <button class="clear-btn" id="clearBtn">Clear All Data</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const paymentForm = document.getElementById('paymentForm');
        const paymentList = document.getElementById('paymentList');
        const totalDisplay = document.getElementById('totalDisplay');
        const clearBtn = document.getElementById('clearBtn');
        
        // Set default date input to today
        document.getElementById('date').valueAsDate = new Date();

        // Load payments from localStorage or start empty
        let payments = JSON.parse(localStorage.getItem('personPayments')) || [];

        // Function to calculate total and render elements
        function updateUI() {
            paymentList.innerHTML = '';
            let total = 0;

            // Sort payments by date (newest first)
            payments.sort((a, b) => new Date(b.date) - new Date(a.date));

            payments.forEach((payment) => {
                total += parseFloat(payment.amount);

                const li = document.createElement('li');
                li.className = 'payment-item';
                li.innerHTML = `
                    <div class="payment-details">
                        <span class="payment-purpose">${payment.purpose}</span>
                        <span class="payment-date">${payment.date}</span>
                    </div>
                    <span class="payment-value">+$${parseFloat(payment.amount).toFixed(2)}</span>
                `;
                paymentList.appendChild(li);
            });

            // Update running total
            totalDisplay.textContent = `$${total.toFixed(2)}`;
            
            // Save updated array to localStorage
            localStorage.setItem('personPayments', JSON.stringify(payments));
        }

        // Handle form submission
        paymentForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const amount = document.getElementById('amount').value;
            const purpose = document.getElementById('purpose').value;
            const date = document.getElementById('date').value;

            const newPayment = { amount, purpose, date };
            payments.push(newPayment);

            updateUI();

            // Reset description and amount fields
            document.getElementById('amount').value = '';
            document.getElementById('purpose').value = '';
            document.getElementById('date').valueAsDate = new Date();
        });

        // Handle clear data button
        clearBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to delete all logged payments? This cannot be undone.')) {
                payments = [];
                updateUI();
            }
        });

        // Initialize UI on page load
        updateUI();
    </script>
</body>
</html>
